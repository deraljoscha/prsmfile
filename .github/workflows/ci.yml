name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Tests
        run: pytest -q
      - name: Build wheel and smoke test it
        run: |
          python -m pip wheel . -w dist --no-deps
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/prsmfile" --version
          "$RUNNER_TEMP/smoke/bin/prsmfile" examples/example.prism
          "$RUNNER_TEMP/smoke/bin/prsmfile" examples/example.prism --json

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the sdist, unpack it and run its tests
        run: |
          python -m pip install build pytest
          python -m build --sdist --outdir "$RUNNER_TEMP/sdist" .
          mkdir "$RUNNER_TEMP/unpacked"
          tar xzf "$RUNNER_TEMP/sdist"/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP"/unpacked/prsmfile-*
          python -m pip install .
          python -m pytest -q -p no:cacheprovider

  corpus:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: python scripts/fetch_corpus.py
      - run: pytest -q tests/test_corpus.py
