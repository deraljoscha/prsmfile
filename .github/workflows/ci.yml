name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Tests
        run: pytest -q
      - name: Build wheel and smoke test it
        run: |
          python -m pip wheel . -w dist --no-deps
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/prsmfile" --version
          if [ -f examples/cc0-figure4.prism ]; then
            "$RUNNER_TEMP/smoke/bin/prsmfile" examples/cc0-figure4.prism --list
          fi

  corpus:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: python scripts/fetch_corpus.py
      - run: pytest -q tests/test_corpus.py
